name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
env:
  POSTGRESQL: 18
  TARGET_PROJECT_NAME: myproj                 # removed by rename.sh
  RUSTFLAGS: -Dwarnings
  RUST: nightly-2026-06-30
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./rename.sh $TARGET_PROJECT_NAME # removed by rename.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy check
        run: cargo clippy --all-targets
  build-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./rename.sh $TARGET_PROJECT_NAME # removed by rename.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - name: Set up PostgreSQL
        run: |
          sudo systemctl stop postgresql
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt install postgresql-$POSTGRESQL
          sudo pg_createcluster $POSTGRESQL main
          sudo sed -i -e 's|5433|5432|' /etc/postgresql/$POSTGRESQL/main/postgresql.conf
          sudo sed -i -e '/^local/ s|peer|trust|' /etc/postgresql/$POSTGRESQL/main/pg_hba.conf
          sudo pg_ctlcluster $POSTGRESQL main start
      - name: Init the database
        run: |
          psql --username postgres -c "CREATE DATABASE $TARGET_PROJECT_NAME"
          psql --username postgres -c "CREATE USER $TARGET_PROJECT_NAME WITH PASSWORD '$TARGET_PROJECT_NAME'"
          psql --username postgres -c "GRANT ALL ON DATABASE $TARGET_PROJECT_NAME TO $TARGET_PROJECT_NAME"
      - name: Build as workspace
        run: cargo build
      - name: Run the daemon
        run: |
          # only timeout is condidered success here, any early exit is a failure
          timeout 2s cargo run --bin $TARGET_PROJECT_NAME-daemon -- --dsn postgresql://$TARGET_PROJECT_NAME:$TARGET_PROJECT_NAME@localhost/$TARGET_PROJECT_NAME && exit 1 || [ $? -eq 124 ]
      - name: Run the webapp
        run: |
          # only timeout is condidered success here, any early exit is a failure
          timeout 2s cargo run --bin $TARGET_PROJECT_NAME-web -- --dsn postgresql://$TARGET_PROJECT_NAME:$TARGET_PROJECT_NAME@localhost/$TARGET_PROJECT_NAME --listen 127.0.0.1:3000 && exit 1 || [ $? -eq 124 ]
  build-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./rename.sh $TARGET_PROJECT_NAME # removed by rename.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - uses: taiki-e/install-action@cargo-hack
      - name: Build as individual crates
        run: cargo hack --workspace build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./rename.sh $TARGET_PROJECT_NAME # removed by rename.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - name: Set up PostgreSQL
        run: |
          sudo systemctl stop postgresql
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt install postgresql-$POSTGRESQL
          sudo pg_createcluster $POSTGRESQL main
          sudo sed -i -e 's|5433|5432|' /etc/postgresql/$POSTGRESQL/main/postgresql.conf
          sudo sed -i -e '/^local/ s|peer|trust|' /etc/postgresql/$POSTGRESQL/main/pg_hba.conf
          sudo pg_ctlcluster $POSTGRESQL main start
      - name: Init the database
        run: |
          psql --username postgres -c "CREATE DATABASE $TARGET_PROJECT_NAME"
          psql --username postgres -c "CREATE USER $TARGET_PROJECT_NAME WITH PASSWORD '$TARGET_PROJECT_NAME'"
          psql --username postgres -c "GRANT ALL ON DATABASE $TARGET_PROJECT_NAME TO $TARGET_PROJECT_NAME"
      - name: Test
        run: cargo test
        env:
          DATABASE_URL: postgres:///?user=postgres
